<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师页 · Elementary Listening 1</title>
<style>
  :root{
    --ink:#1d2340; --ink2:#5b6480; --line:#e3e7f1;
    --brand:#4c5fd5; --ok:#1e9e6a; --warn:#c9781a; --bad:#d8483a;
    --bg:#f6f7fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:20px 15px 60px}
  a{color:var(--brand)}
  h1{font-size:20px;margin-bottom:4px}
  .sub{font-size:13px;color:var(--ink2);line-height:1.6}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .back{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:99px;
        padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none}
  .back:hover{border-color:var(--brand);color:var(--brand)}

  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .panel h2{font-size:14.5px;margin-bottom:10px}
  .panel p{font-size:13px;color:var(--ink2);line-height:1.7}
  .panel .row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  input[type=text],input[type=password]{
    width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:9px;
    font-size:14px;font-family:inherit;outline:none;transition:.15s;
  }
  input[type=text]:focus,input[type=password]:focus{border-color:var(--brand)}
  button{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;
         cursor:pointer;font-family:inherit;transition:.15s}
  .primary{background:var(--brand);color:#fff}
  .primary:hover{background:#3f50bd}
  .ghost{background:#f1f3f9;color:var(--ink2)}
  .ghost:hover{background:#e6eaf5}
  .danger{background:#fdeeec;color:var(--bad)}
  .danger:hover{background:#fadbd7}
  .tiny{padding:6px 11px;font-size:12px}
  button:disabled{opacity:.45;cursor:default}

  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;margin-inline-start:8px}
  .badge.on{background:#e7f7f0;color:var(--ok)}
  .badge.off{background:#f1f3f9;color:#98a0b8}
  .badge.wait{background:#fff5e6;color:var(--warn)}

  .lesson{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
  .lesson-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .lesson-head b{font-size:20px;font-weight:800;color:var(--brand);letter-spacing:-.5px}
  .lesson-head span{font-size:12px;color:var(--ink2)}
  .slotrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media(max-width:560px){.slotrow{grid-template-columns:1fr}}
  .cell{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fafbfe}
  .cell .name{font-size:13px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .cell .file{font-size:11px;color:var(--ink2);word-break:break-all;margin-top:4px;font-family:ui-monospace,Menlo,monospace}
  .cell .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

  .log{background:#161a2b;color:#c7d0ea;border-radius:11px;padding:12px 14px;font-size:12px;
       font-family:ui-monospace,Menlo,monospace;line-height:1.65;max-height:190px;overflow:auto;white-space:pre-wrap}
  .log:empty{display:none}

  .overlay{position:fixed;inset:0;background:rgba(20,25,45,.55);z-index:100;
           display:flex;align-items:center;justify-content:center;padding:18px}
  .overlay[hidden]{display:none}
  .dialog{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(15,20,40,.3)}
  .dialog h3{font-size:17px;margin-bottom:12px;text-align:center}
  .dialog .err{color:var(--bad);font-size:12.5px;min-height:17px;margin-top:8px;text-align:center}
  .dialog .row{display:flex;gap:9px;margin-top:12px}
  .dialog .row button{flex:1}
  .codebox{background:#f1f3f9;border-radius:8px;padding:9px 11px;font-size:12.5px;
           font-family:ui-monospace,Menlo,monospace;word-break:break-all;margin:8px 0;text-align:center}
  .steps{font-size:13px;color:var(--ink2);line-height:1.8;padding-inline-start:18px}
  .steps li{margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>教师页</h1>
      <p class="sub">上传、替换、删除 30 课 × 2 个闪卡文件</p>
    </div>
    <a class="back" href="index.html">← 返回书架</a>
  </div>

  <!-- 令牌设置 -->
  <div class="panel" id="tokenPanel">
    <h2>① GitHub 令牌（可选，但强烈建议）</h2>
    <p id="tokenState">还没有令牌，目前只能查看状态和获取手动操作提示。</p>
    <div class="row" id="tokenForm" style="display:none">
      <input type="password" id="tokenInput" placeholder="粘贴 GitHub 令牌（ghp_... 或 github_pat_...）">
      <button class="primary" id="tokenSave">保存并验证</button>
    </div>
    <div class="row" id="tokenActions" style="display:none">
      <button class="ghost" id="tokenChange">更换令牌</button>
      <button class="danger" id="tokenClear">清除令牌</button>
    </div>
    <p style="margin-top:10px;font-size:12px">
      没有令牌也能用：下面每个格子点「选择文件」后，会告诉你要拖到哪个位置。
    </p>
  </div>

  <!-- 槽位列表 -->
  <div id="list"></div>

  <!-- 日志 -->
  <div class="panel">
    <h2>操作记录</h2>
    <div class="log" id="log"></div>
  </div>
</div>

<!-- 密码弹窗 -->
<div class="overlay" id="pwOverlay" hidden>
  <div class="dialog">
    <h3>教师密码</h3>
    <input type="password" id="pwInput" autocomplete="off" spellcheck="false">
    <p class="err" id="pwErr"></p>
    <div class="row">
      <button class="ghost" id="pwCancel">取消</button>
      <button class="primary" id="pwOk">进入</button>
    </div>
  </div>
</div>

<!-- 手动上传提示弹窗 -->
<div class="overlay" id="manualOverlay" hidden>
  <div class="dialog">
    <h3>手动上传</h3>
    <p class="sub" id="manualIntro"></p>
    <div class="codebox" id="manualName"></div>
    <ol class="steps">
      <li><b>先在电脑上把文件改名</b>成上面那个名字（GitHub 网页不能改名）</li>
      <li>点「打开 GitHub 上传页」，页面会直接到 <code>cards</code> 文件夹</li>
      <li>把改好名的文件拖进去</li>
      <li>点 Commit changes，等约 1 分钟</li>
    </ol>
    <div class="row">
      <button class="ghost" id="manualCopy">复制文件名</button>
      <button class="primary" id="manualOpen">打开 GitHub 上传页</button>
    </div>
    <div class="row"><button class="ghost" id="manualClose" style="flex:1">关闭</button></div>
  </div>
</div>

<script>
/* ===== 配置（改仓库信息只改这里） ===== */
const OWNER  = 'karlekuroba-lab';
const REPO   = 'elementary-listening-1';
const BRANCH = 'main';
const PASSWORD = 'rehcaetmai';   // 和 index.html 保持一致
const AUTH_KEY = 'el1_auth';
const TOKEN_KEY = 'el1_token';
const LESSONS = 30;

/* ===== 密码门禁 ===== */
const pwOverlay = document.getElementById('pwOverlay');
const pwInput = document.getElementById('pwInput');
const pwErr = document.getElementById('pwErr');

function authed(){
  try { return sessionStorage.getItem(AUTH_KEY) === '1'; } catch (e) { return false; }
}
function showGate(){
  pwOverlay.hidden = false;
  setTimeout(() => pwInput.focus(), 30);
}
document.getElementById('pwOk').addEventListener('click', () => {
  if (pwInput.value === PASSWORD) {
    try { sessionStorage.setItem(AUTH_KEY, '1'); } catch (e) {}
    pwOverlay.hidden = true;
    boot();
  } else {
    pwErr.textContent = '密码不对';
    pwInput.select();
  }
});
document.getElementById('pwCancel').addEventListener('click', () => { location.href = 'index.html'; });
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('pwOk').click(); });

/* ===== 工具 ===== */
function pad2(n){ return String(n).padStart(2,'0'); }
function slotPath(n, kind){ return 'cards/lesson' + pad2(n) + '_' + kind + '.html'; }
function slotName(n, kind){ return 'lesson' + pad2(n) + '_' + kind + '.html'; }

function log(msg){
  const el = document.getElementById('log');
  const line = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.textContent = line + '\n' + el.textContent;
}

function b64(text){
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}

let token = '';
try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}

function apiUrl(path){
  return 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + path;
}
function headers(){
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

async function ghGetSha(path){
  const r = await fetch(apiUrl(path) + '?ref=' + BRANCH, { headers: headers() });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('读取失败 HTTP ' + r.status);
  const j = await r.json();
  return j.sha;
}

async function ghPut(path, text, message){
  const sha = await ghGetSha(path);
  const body = { message: message, content: b64(text), branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(apiUrl(path), {
    method: 'PUT', headers: headers(), body: JSON.stringify(body)
  });
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j.message) msg = j.message; } catch (e) {}
    throw new Error(msg);
  }
  return true;
}

async function ghDelete(path, message){
  const sha = await ghGetSha(path);
  if (!sha) return true;
  const r = await fetch(apiUrl(path), {
    method: 'DELETE', headers: headers(),
    body: JSON.stringify({ message: message, sha: sha, branch: BRANCH })
  });
  if (!r.ok) throw new Error('删除失败 HTTP ' + r.status);
  return true;
}

async function exists(url){
  try {
    const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    return r.ok;
  } catch (e) { return false; }
}

/* ===== 令牌面板 ===== */
function renderTokenPanel(){
  const state = document.getElementById('tokenState');
  const form  = document.getElementById('tokenForm');
  const acts  = document.getElementById('tokenActions');
  if (token) {
    state.innerHTML = '<span class="badge on">已连接</span> 可以使用一键上传。提交后约 1 分钟生效。';
    form.style.display = 'none';
    acts.style.display = 'flex';
  } else {
    state.innerHTML = '<span class="badge off">未设置</span> 目前只能查看状态和手动上传。';
    form.style.display = 'flex';
    acts.style.display = 'none';
  }
}

async function verifyToken(tk){
  const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO, {
    headers: { 'Authorization': 'Bearer ' + tk, 'Accept': 'application/vnd.github+json' }
  });
  if (r.ok) return true;
  if (r.status === 401) throw new Error('令牌无效或已过期');
  if (r.status === 404) throw new Error('找不到仓库 ' + OWNER + '/' + REPO + '（检查仓库名，以及令牌是否勾选了该仓库）');
  throw new Error('HTTP ' + r.status);
}

document.getElementById('tokenSave').addEventListener('click', async () => {
  const val = document.getElementById('tokenInput').value.trim();
  if (!val) return;
  const btn = document.getElementById('tokenSave');
  btn.disabled = true; btn.textContent = '验证中...';
  try {
    await verifyToken(val);
    token = val;
    try { localStorage.setItem(TOKEN_KEY, val); } catch (e) {}
    document.getElementById('tokenInput').value = '';
    renderTokenPanel();
    log('✓ 令牌验证通过，已保存在本机浏览器');
    renderList(true);
  } catch (e) {
    log('✗ ' + e.message);
    alert(e.message);
  } finally {
    btn.disabled = false; btn.textContent = '保存并验证';
  }
});

document.getElementById('tokenChange').addEventListener('click', () => {
  document.getElementById('tokenForm').style.display = 'flex';
  document.getElementById('tokenActions').style.display = 'none';
});
document.getElementById('tokenClear').addEventListener('click', () => {
  token = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  renderTokenPanel();
  log('已清除本机令牌');
  renderList(true);
});

/* ===== 槽位列表 ===== */
let statusMap = {};

function renderList(reprobe){
  const list = document.getElementById('list');
  if (!list.dataset.built) {
    list.innerHTML = '';
    for (let i = 1; i <= LESSONS; i++){
      const box = document.createElement('div');
      box.className = 'lesson';
      let html = '<div class="lesson-head"><b>' + i + '</b><span>课</span></div><div class="slotrow">';
      ['words','sentences'].forEach(kind => {
        const nm = slotName(i, kind);
        const label = kind === 'words' ? '生词' : '句子';
        html += '<div class="cell" data-key="' + i + '_' + kind + '">' +
          '<div class="name">' + label + '<span class="badge off" data-badge>' + '检测中' + '</span></div>' +
          '<div class="file">' + nm + '</div>' +
          '<div class="acts">' +
            '<button class="primary tiny" data-act="upload">选择文件</button>' +
            '<button class="ghost tiny" data-act="view">查看</button>' +
            '<button class="danger tiny" data-act="del">删除</button>' +
          '</div></div>';
      });
      html += '</div>';
      box.innerHTML = html;
      list.appendChild(box);
    }
    list.dataset.built = '1';
    bindActs(list);
  }
  if (reprobe !== false) probeAll();
}

function bindActs(list){
  list.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    const cell = btn.closest('.cell');
    const [lessonStr, kind] = cell.dataset.key.split('_');
    const lesson = parseInt(lessonStr, 10);
    const path = slotPath(lesson, kind);
    const act = btn.dataset.act;

    if (act === 'upload') {
      pickFile(lesson, kind, path);
    } else if (act === 'view') {
      if (statusMap[path]) window.open(path, '_blank');
    } else if (act === 'del') {
      if (!token) { alert('删除需要先设置令牌。也可以用 GitHub 网页手动删除。'); return; }
      if (!confirm('确定删除 ' + slotName(lesson, kind) + ' ？')) return;
      btn.disabled = true;
      try {
        await ghDelete(path, 'delete ' + slotName(lesson, kind));
        log('✓ 已删除 ' + slotName(lesson, kind));
        await probeAll();
      } catch (e) { log('✗ ' + e.message); alert(e.message); }
      finally { btn.disabled = false; }
    }
  });
}

/* 文件选择框（复用同一个 input） */
let picker = null;
function pickFile(lesson, kind, path){
  if (!picker) {
    picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = '.html,text/html';
    picker.style.display = 'none';
    document.body.appendChild(picker);
  }
  picker.value = '';
  picker.onchange = async () => {
    const f = picker.files && picker.files[0];
    if (!f) return;
    if (token) {
      await uploadWithToken(f, lesson, kind, path);
    } else {
      showManual(lesson, kind);
    }
  };
  picker.click();
}

async function uploadWithToken(file, lesson, kind, path){
  const btnLabel = slotName(lesson, kind);
  try {
    log('↑ 正在上传 ' + btnLabel + '（' + Math.round(file.size / 1024) + ' KB）...');
    const text = await file.text();
    if (!/<html/i.test(text.slice(0, 2000))) {
      if (!confirm('这个文件看起来不是 HTML，仍要继续吗？')) return;
    }
    await ghPut(path, text, 'upload ' + btnLabel);
    log('✓ 已提交 ' + btnLabel + '，约 1 分钟后生效');
    await probeAll();
  } catch (e) {
    log('✗ ' + e.message);
    alert(e.message);
  }
}

function showManual(lesson, kind){
  const nm = slotName(lesson, kind);
  document.getElementById('manualIntro').textContent =
    '你还没设置令牌，所以需要手动把文件放进仓库。目标文件名：';
  document.getElementById('manualName').textContent = nm;
  const ov = document.getElementById('manualOverlay');
  ov.hidden = false;

  document.getElementById('manualCopy').onclick = () => {
    navigator.clipboard.writeText(nm).then(
      () => log('已复制文件名：' + nm),
      () => alert('复制失败，请手动记住：' + nm)
    );
  };
  document.getElementById('manualOpen').onclick = () => {
    window.open('https://github.com/' + OWNER + '/' + REPO + '/upload/' + BRANCH + '/cards', '_blank');
  };
  document.getElementById('manualClose').onclick = () => { ov.hidden = true; };
}

async function probeAll(){
  const cells = Array.from(document.querySelectorAll('.cell'));
  const paths = cells.map(c => {
    const [l, k] = c.dataset.key.split('_');
    return slotPath(parseInt(l, 10), k);
  });
  const res = await Promise.all(paths.map(p => exists(p)));
  cells.forEach((c, i) => {
    const badge = c.querySelector('[data-badge]');
    const viewBtn = c.querySelector('button[data-act="view"]');
    statusMap[paths[i]] = res[i];
    if (res[i]) {
      badge.className = 'badge on';
      badge.textContent = '已上传';
      viewBtn.disabled = false;
    } else {
      badge.className = 'badge off';
      badge.textContent = '未上传';
      viewBtn.disabled = true;
    }
  });
}

/* ===== 启动 ===== */
function boot(){
  renderTokenPanel();
  renderList(true);
  log('已进入教师页。仓库：' + OWNER + '/' + REPO);
}

if (authed()) boot(); else showGate();
</script>
</body>
</html>
